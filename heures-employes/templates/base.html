<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Suivi des heures{% endblock %} – {{ company }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="brand">⏱ {{ company }}</div>
  <nav>
    <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Saisie</a>
    <a href="{{ url_for('employees') }}" class="{{ 'active' if request.endpoint == 'employees' }}">Employés</a>
    <a href="{{ url_for('history') }}" class="{{ 'active' if request.endpoint == 'history' }}">Historique</a>
    <a href="{{ url_for('report_page') }}" class="{{ 'active' if request.endpoint == 'report_page' }}">Rapport</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
